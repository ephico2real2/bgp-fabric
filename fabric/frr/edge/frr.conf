frr defaults traditional
hostname edge
log stdout
!
! Loopback /32 is programmed by zebra from this stanza (same file as
! `network` and `bgp router-id`). An entrypoint `ip addr add` would race
! zebra and become a second source of truth.
interface lo
 ip address 10.200.255.1/32
!
router bgp 65000
 bgp router-id 10.200.255.1
 bgp bestpath as-path multipath-relax
 maximum-paths 8
 neighbor 10.200.1.18 remote-as 65100
 neighbor 10.200.1.18 description spine
 neighbor 10.200.1.18 password ${FABRIC_BGP_PASSWORD}
 neighbor 10.200.1.18 timers 3 9
 neighbor 10.200.1.18 soft-reconfiguration inbound
 neighbor 10.200.1.18 route-map FABRIC-IN in
 neighbor 10.200.1.18 route-map EDGE-OUT out
 neighbor 10.200.1.18 maximum-prefix 256
 network 10.200.100.0/24
 network 10.200.255.1/32
!
ip prefix-list COMPANY seq 10 permit 10.200.0.0/16 le 32
ip prefix-list EG-VIPS seq 10 permit 10.198.0.0/24 ge 32 le 32
ip prefix-list CILIUM-VIPS seq 10 permit 10.199.0.0/24 ge 32 le 32
ip prefix-list WAN seq 10 permit 10.200.100.0/24
ip prefix-list LOOPBACKS seq 10 permit 10.200.255.0/24 le 32
!
route-map FABRIC-IN permit 10
 match ip address prefix-list COMPANY
route-map FABRIC-IN permit 20
 match ip address prefix-list EG-VIPS
route-map FABRIC-IN permit 30
 match ip address prefix-list CILIUM-VIPS
!
route-map EDGE-OUT permit 10
 match ip address prefix-list WAN
route-map EDGE-OUT permit 20
 match ip address prefix-list LOOPBACKS
!
