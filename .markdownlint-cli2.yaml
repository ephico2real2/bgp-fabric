# markdownlint-cli2 — the rules this repository's pages follow, run by
# `scripts/mdfmt`. Rules that would force mass edits of recorded evidence or of
# the established style are off here, each with its reason.
config:
  default: true
  MD013: false        # line length: transcripts, tables and URLs are long on purpose
  MD024: { siblings_only: true }
  MD033: false        # inline HTML
  MD040: false        # fenced code without a language: recorded-output blocks
  MD041: false        # first line need not be a heading
  MD036: false        # emphasis used as a heading is a deliberate style here
  MD034: false        # bare URLs appear inside recorded output
  MD060: false        # table column style
ignores:
  - "output/**"
  - "dashboard/static/vendor/**"
  - "node_modules/**"
  - ".tmp/**"
